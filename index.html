<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Make it easy – Sostituzioni</title>
<meta name="theme-color" content="#9a7bd6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sostituzioni">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: one calm column, sticky header with tabs; borders only on what needs action (ore da coprire) */
:root{
  --bg:#ffffff; --surface:#f7f5fb; --line:#e6e0f0; --fg:#211b2e; --muted:#6c6482;
  --accent:#9a7bd6;
  --accent-soft:color-mix(in oklab,var(--accent) 14%,var(--bg));
  --accent-strong:color-mix(in oklab,var(--accent) 70%,#000);
  --ok:#2e8a57; --warn:#a8691a; --bad:#c03d4a;
  --inf:#b5652e; --pri:#2b7f86;
  --ok-soft:color-mix(in oklab,var(--ok) 13%,var(--bg));
  --warn-soft:color-mix(in oklab,var(--warn) 14%,var(--bg));
  --inf-soft:color-mix(in oklab,var(--inf) 14%,var(--bg));
  --pri-soft:color-mix(in oklab,var(--pri) 14%,var(--bg));
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15121c;--surface:#1f1a29;--line:#332c42;--fg:#f0ebf8;--muted:#a79fbc;
  --accent-strong:color-mix(in oklab,var(--accent) 62%,#fff);
  --ok:#5cc489;--warn:#e0a24a;--bad:#ef7480;--inf:#e7a06f;--pri:#6cc3c9;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15121c;--surface:#1f1a29;--line:#332c42;--fg:#f0ebf8;--muted:#a79fbc;
  --accent-strong:color-mix(in oklab,var(--accent) 62%,#fff);
  --ok:#5cc489;--warn:#e0a24a;--bad:#ef7480;--inf:#e7a06f;--pri:#6cc3c9;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in oklab,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in,.tabs,.main{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{padding-block:12px 4px}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand>span{display:flex;flex-direction:column}
.app{font-family:var(--f-display);font-weight:800;font-size:1.35rem;letter-spacing:-.015em;line-height:1.1}
.hi{color:var(--muted);font-size:.85rem}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;display:inline-grid;place-items:center;background:var(--accent);color:#fff;font-family:var(--f-display);font-weight:800;flex:none}
.av.big{width:72px;height:72px;font-size:1.6rem}
.tabs{display:flex;gap:2px;padding-block:4px 0;overflow-x:auto}
.tab{background:none;border:0;padding:10px 12px;border-bottom:3px solid transparent;color:var(--muted);font-weight:700;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.main{padding-block:20px 56px;display:flex;flex-direction:column;gap:24px}
h2{font-family:var(--f-display);font-weight:600;font-size:1.15rem;margin:0;text-wrap:balance}
.block{display:flex;flex-direction:column;gap:10px}
.block-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lbl{display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin-top:4px}
.muted{color:var(--muted)}.sm{font-size:.85rem}
p{margin:0}
input[type=text],input[type=date],input[type=time],select,textarea{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;min-height:44px;width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:36px;padding:0 14px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.link{background:none;border:0;padding:6px 0;color:var(--accent-strong);font-weight:700;cursor:pointer;text-align:left}
.link.bad{color:var(--bad)}
.icon{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;flex:none;font-weight:700}
.icon:disabled{opacity:.3;cursor:default}
.note{padding:10px 12px;border-radius:10px;background:var(--surface);color:var(--muted);font-size:.9rem}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.empty{color:var(--muted)}
.day{display:flex;flex-direction:column;gap:6px}
.day-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.day-row input{width:auto}
.day-name{font-family:var(--f-display);font-weight:600;font-size:1.3rem}
.day-name::first-letter{text-transform:uppercase}
.form{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.seg{display:inline-flex;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:3px;gap:2px;align-self:flex-start;flex-wrap:wrap}
.form .seg{background:var(--bg)}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--accent-strong)}
.checks{display:flex;flex-direction:column;gap:4px}
.checks.row{flex-direction:row;flex-wrap:wrap;gap:4px 18px}
.chk{display:flex;align-items:center;gap:9px;min-height:38px;cursor:pointer}
.chk input,.tog input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}
.assenti{list-style:none;margin:0;padding:0}
.assenti li{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.who{font-weight:700}
.assenti .link{margin-left:auto}
.count{color:var(--muted);font-variant-numeric:tabular-nums}.count b{color:var(--fg)}
.meter{height:6px;border-radius:99px;background:var(--surface);overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent);transition:width .3s}
.slots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.slot{border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.slot.done{background:var(--surface);border-color:transparent}
.slot-h{display:flex;gap:14px;align-items:flex-start}
.time{font-family:var(--f-display);font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;line-height:1.15;min-width:3.3em}
.time small,.gt small{display:block;font-family:var(--f-body);font-weight:400;font-size:.75rem;color:var(--muted)}
.slot-t{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;min-width:0}
.slot-t .muted{flex-basis:100%}
.cls{font-weight:700;font-size:1.05rem}
.ord{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:99px;white-space:nowrap}
.ord-infanzia{background:var(--inf-soft);color:var(--inf)}
.ord-primaria{background:var(--pri-soft);color:var(--pri)}
.ord-medie{background:var(--accent-soft);color:var(--accent-strong)}
.cands{list-style:none;margin:0;padding:0}
.cand{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.cand-n{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{grid-column:1;display:flex;gap:6px;flex-wrap:wrap}
.cand .btn{grid-column:2;grid-row:1/span 2}
.rec{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--accent-strong);background:var(--accent-soft);padding:2px 7px;border-radius:99px}
.chip{font-size:.78rem;padding:2px 8px;border-radius:99px;background:var(--surface);color:var(--muted);font-variant-numeric:tabular-nums}
.chip.t-D{background:var(--ok-soft);color:var(--ok)}
.chip.t-P{background:var(--accent-soft);color:var(--accent-strong)}
.chip.t-R{background:var(--warn-soft);color:var(--warn)}
.assigned{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.assigned b{color:var(--accent-strong)}
.more{align-self:flex-start}
.export{border-top:1px solid var(--line);padding-top:18px}
.docs{list-style:none;margin:0;padding:0}
.doc-row{width:100%;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.doc-row .ords{display:flex;gap:4px;flex-wrap:wrap}
.doc-row .sm{margin-left:auto;font-variant-numeric:tabular-nums}
.back{align-self:flex-start}
.grid-wrap{overflow-x:auto;margin-inline:-4px;padding:2px}
.grid{border-collapse:separate;border-spacing:4px}
.grid th{font-size:.8rem;color:var(--muted);font-weight:700}
.gt{text-align:left;font-variant-numeric:tabular-nums;padding-right:4px}
.cell{min-width:80px;padding:8px 6px;font-size:.88rem;min-height:40px}
.cell.c-L{background:var(--surface);font-weight:700}
.cell.c-D{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.cell.c-P{background:var(--accent-soft);border-color:transparent;color:var(--accent-strong)}
.cell.c-R{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.danger{border-top:1px solid var(--line);padding-top:14px}
.prof{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.av-up{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--accent-strong);font-weight:700}
.grow{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px}
.sw{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.swatch{width:40px;height:40px;border-radius:50%;background:var(--c);border:3px solid var(--bg);box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0;position:relative;overflow:hidden;display:block}
.swatch.on{box-shadow:0 0 0 2.5px var(--fg)}
.swatch.custom{background:conic-gradient(#e57373,#ffd54f,#81c784,#64b5f6,#ba68c8,#e57373)}
.swatch.custom input{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.crit{list-style:none;margin:0;padding:0;counter-reset:c}
.crit li{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);counter-increment:c}
.crit li::before{content:counter(c);font-family:var(--f-display);font-weight:800;color:var(--accent-strong);width:1.1em}
.crit li.off{opacity:.5}
.crit .chk{flex:1}
.mv{display:flex;gap:6px}
.toggles{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.tog{display:flex;gap:10px;align-items:center;min-height:42px;cursor:pointer}
.ord-box{border:1.5px solid var(--line);border-radius:var(--r);padding:0 14px}
.ord-box summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;cursor:pointer;list-style:none}
.ord-box summary::-webkit-details-marker{display:none}
.ord-box[open]{padding-bottom:12px}
.ord-box .lbl{margin:10px 0 6px}
.fasce,.classi{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.fasce li,.classi li{display:flex;gap:8px;align-items:center}
.fasce input,.classi input{flex:1;min-width:0;width:auto}
textarea{resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:.8rem}
.warn-t{color:var(--warn);font-weight:700;font-size:.9rem}
.reset{border-top:1px solid var(--line);padding-top:10px;margin-top:6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:20;max-width:calc(100% - 32px);text-align:center}
.sheet{position:fixed;inset:0;background:color-mix(in oklab,var(--fg) 40%,transparent);display:grid;place-items:end center;z-index:30;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet-in{background:var(--bg);border-radius:var(--r);padding:16px;width:100%;max-width:560px;display:flex;flex-direction:column;gap:10px}
.proto{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.search{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search input{flex:1;min-width:180px;width:auto}
.week{display:flex;flex-direction:column;gap:14px}
.wday h3{font-family:var(--f-display);font-weight:600;font-size:1rem;margin:0 0 4px}
.wlist{list-style:none;margin:0;padding:0}
.wlist li{display:grid;grid-template-columns:7.2em minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.wlist .t{font-variant-numeric:tabular-nums;font-weight:700}
.wlist .w{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.tag{font-size:.78rem;padding:2px 8px;border-radius:99px;background:var(--surface);color:var(--muted)}
.tag.t-D{background:var(--ok-soft);color:var(--ok)}
.tag.t-P{background:var(--accent-soft);color:var(--accent-strong)}
.tag.t-R{background:var(--warn-soft);color:var(--warn)}
.tag.t-X{background:var(--surface);color:var(--muted)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.row2>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.chip.t-C{background:var(--pri-soft);color:var(--pri)}
.chip.t-B{background:var(--ok-soft);color:var(--ok)}
.chip.t-G{background:var(--surface);color:var(--fg)}
.chip.t-F{background:var(--surface);color:var(--muted)}
.prova{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:99px;background:var(--warn-soft);color:var(--warn)}
.presenti{font-size:.88rem;color:var(--pri)}
.fonte{display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.chip.t-K{background:var(--warn-soft);color:var(--warn)}
.sync{font-weight:700}
.sync.s-ok{color:var(--ok)}.sync.s-offline,.sync.s-invio,.sync.s-carico{color:var(--warn)}.sync.s-errore{color:var(--bad)}
.login{max-width:420px;margin:8vh auto 0;width:100%}
.login .brand{cursor:default}
.eyebrow{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;line-height:1.2}
.tab-wrap{overflow-x:auto;margin-inline:-2px}
.rie{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.92rem}
.rie th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 8px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.rie td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.rie tr.det td{white-space:normal;background:var(--surface)}
.persone{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.persone li{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.persone .pe{overflow-wrap:anywhere;font-weight:700;font-size:.9rem}
.persone select{min-height:38px;padding:4px 8px;font-size:.85rem}
@media (max-width:560px){.persone li{grid-template-columns:minmax(0,1fr) auto}.persone .pe{grid-column:1/-1}.persone select{grid-column:1/-1}}
.usost{display:flex;gap:14px;align-items:flex-start;border:1.5px solid var(--accent);border-radius:var(--r);padding:12px 14px;background:var(--accent-soft)}
.ugiorno{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.tabellone{list-style:none;margin:0;padding:0}
.tabellone li{display:grid;grid-template-columns:7.2em minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}
.tabellone li .w{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.tabellone li .t{font-variant-numeric:tabular-nums;font-weight:700}
.tabellone li.mia{background:var(--accent-soft);border-radius:8px;padding-inline:8px}
.passi{white-space:pre-wrap;font-size:.72rem;color:var(--muted);margin:0;padding-bottom:10px;overflow-wrap:anywhere}
.ok-t{color:var(--ok)}
.storia{list-style:none;margin:0;padding:0}
.storia .st-g{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:14px 0 4px}
.storia .st{border-bottom:1px solid var(--line);padding:8px 0}
.storia .st-h{display:grid;grid-template-columns:3.2em minmax(0,1fr) auto;gap:10px;align-items:center}
.storia .st-h .t{font-variant-numeric:tabular-nums;font-weight:700}
.storia .st-w{display:flex;flex-direction:column;gap:2px;min-width:0;overflow-wrap:anywhere}
.storia .st-off .st-w b{text-decoration:line-through;color:var(--muted)}
.storia details{margin:4px 0 0 calc(3.2em + 10px)}
.storia .st-r{margin:4px 0;padding-left:18px;font-size:.88rem}
.storia .note{margin:6px 0 0}
@media (max-width:560px){.storia .st-h{grid-template-columns:3em minmax(0,1fr)}.storia .st-h>.btn,.storia .st-h>.btns{grid-column:2}}
.top-in{display:flex;align-items:center;gap:10px;justify-content:space-between}
.vai-app{flex:none;text-decoration:none;font-weight:700;font-size:.85rem;color:var(--accent-strong);background:var(--accent-soft);border-radius:999px;padding:8px 14px;white-space:nowrap}
.vai-app:active{transform:scale(.97)}
.or-nomi{margin:.6rem 0;padding:.6rem .7rem;border-radius:12px;background:var(--soft,#f4f0fb)}
.or-nome{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .8rem;margin:.35rem 0}
.or-nome span{font-weight:700;min-width:7rem}
.or-nome select{flex:1;min-width:12rem}
.conf-sost{flex-basis:100%;margin-top:.4rem;padding:.5rem .7rem;border-radius:10px;background:#fff4e5}
.conf-sost .btns{margin-top:.4rem}
.wz-tab{overflow:auto;max-height:55vh;border:1px solid var(--line,#e4dcf3);border-radius:10px;margin:.5rem 0;-webkit-overflow-scrolling:touch}
.wz-tab table{border-collapse:collapse;font-size:.72rem;white-space:nowrap}
.wz-tab td{border:1px solid #eee;padding:.15rem .3rem;max-width:7rem;overflow:hidden}
.wz-tab td.cont{background:#fafafa}
.wz-tab th{position:sticky;left:0;background:#fff;z-index:1}
.wz-tab tr.on td{background:#ffe9a8;font-weight:700}
.wz-r{font:inherit;font-size:.72rem;min-width:2.2rem;min-height:1.8rem;border:1px solid #ccc;border-radius:6px;background:#f6f3fc;cursor:pointer}
.wz-tab tr.on .wz-r{background:#9a7bd6;color:#fff;border-color:#9a7bd6}
.wz-cols{list-style:none;padding:0;margin:.5rem 0}
.wz-cols li{display:flex;flex-wrap:wrap;gap:.35rem .6rem;align-items:center;padding:.45rem 0;border-bottom:1px solid #eee}
.wz-h{display:flex;flex-direction:column;min-width:8rem;flex:1}

const FONTE="Orario settimanale 2026/27 (PDF della Direzione, 24 settembre 2026)";
const ORARIO={"classi":[],"docenti":[]};
const KEY='makeiteasy.v3';
const $app=document.getElementById('app');
const G_BREVI=['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];

const NOMI_ORD={infanzia:'Infanzia',primaria:'Primaria',medie:'Medie'};
const TIPO_C={C:'Già in classe',Q:'Secondo nome in compresenza: lascia la sua classe',S:'Tolto da una compresenza in primaria o dal sostegno',K:'Spostamento a catena',D:'A disposizione',P:'Lascia il potenziamento',R:'Recupero ore',B:'Ora buca, è a scuola',G:'Ora eccedente',F:'Non è a scuola, si può chiamare'};

const CRIT={C:'Docente già in classe (compresenza)',Q:'Secondo nome in una compresenza: si sposta con priorità (dalla primaria solo chi può venire alle medie)',D:'Ore a disposizione',B:'Ha un\'ora buca (è già a scuola)',abituale:'Da fuori: prima i preferiti, poi gli occasionali, per ultimi quelli in extremis',P:'Docente in potenziamento',S:'Tolto da una compresenza in primaria o dal sostegno',R:'Recupero permessi',G:'È a scuola prima o dopo (ora eccedente)',classe:'Conosce già la classe',meno:'Ha fatto meno sostituzioni'};
const SWATCH=[['Lilla','#9a7bd6'],['Glicine','#7d6fc4'],['Malva','#b77aa8'],['Salvia','#5e9a7a'],['Cielo','#4f8fc0'],['Pesca','#d98a5f']];
let TOP=false;try{TOP=window.self===window.top}catch(e){}

const uid=()=>Math.random().toString(36).slice(2,9);
const val=id=>document.getElementById(id)?.value??'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm=m=>`${Math.floor(m/60)}.${String(m%60).padStart(2,'0')}`;

const toT=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const ov=(a,b,c,d)=>a<d&&c<b;
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const byName=(a,b)=>(a.nome||'').localeCompare(b.nome||'','it');
function nextSchoolDay(d,sab){d=new Date(d);while(d.getDay()===0||(d.getDay()===6&&!sab))d.setDate(d.getDate()+1);return d}

/* ---------- Dati iniziali: orario reale importato dal PDF ---------- */
function seed(){
  const o=JSON.parse(JSON.stringify(ORARIO));
  const s={v:3,fonte:FONTE,
    profilo:{nome:'',foto:null,accento:'#9a7bd6'},
    classi:o.classi,docenti:o.docenti,assenze:[],sostituzioni:[],

  const by=n=>s.docenti.find(x=>x.nome===n);
  const giorniDi=d=>[...new Set(d.orario.filter(e=>e.tipo==='L').map(e=>e.g))].sort();
  const tutti=v=>({1:v,2:v,3:v,4:v,5:v,6:v});

/* ---------- Cronologia e Annulla ----------

const nomeDoc=id=>docente(id)?.nome||'';

function assenteIn(docId,data,a,b){

function copre(d,g,e){

function candidati(sc){
  const g=giorno(sc.data);const res=[];

    const abil=d.ordini.includes(sc.ordine);
    if(!comp&&!abil)continue;
    if(assenteIn(d.id,sc.data,sc.a,sc.b))continue;
    if(impegnato(d,sc.data,sc.a,sc.b,sc.e.id))continue;
    let t,info='';const disp=d.disp||{};
    if(busy.length){

        const vuote=busy.filter(e=>!S.docenti.some(o=>o.id!==d.id&&copre(o,g,e)));
        var lascia=vuote.length>0;info=vuote.length?vuote.map(e=>e.label).join(', ')+' resterebbe senza docente':'in '+busy.map(e=>e.label).join(', ')}
      else if(abil&&(S.opzioni.qSostegno||!busy.some(isSostegno))&&busy.every(e=>e.tipo==='L'&&e.comp&&e.comp.pos>=1&&altriInClasse(e,g,sc.data,[d.id]))){t='Q';info='secondo nome in '+busy.map(e=>e.label+(e.ordine!=='medie'?' '+e.ordine:'')+(e.comp.con?.length?' con '+e.comp.con.join(', '):'')).join('; ')}
      else if(busy.every(e=>e.tipo==='L'&&(e.ordine==='primaria'||isSostegno(e))&&altriInClasse(e,g,sc.data,[d.id]))){t='S';info=busy.map(e=>e.label+(isSostegno(e)?' (sostegno)':' primaria')).join(', ')}
      else continue;
    }
    else if(qui.some(e=>e.tipo==='D'))t='D';
    else if(qui.some(e=>e.tipo==='P'))t='P';
    else if(qui.some(e=>e.tipo==='R'))t='R';
    else{
      const lav=e=>occupa(e)&&!facoltativo(e)&&!/^(Pre|Dopo)-scuola/.test(e.label);
      const prima=oggi.filter(e=>lav(e)&&e.b<=sc.a),dopo=oggi.filter(e=>lav(e)&&e.a>=sc.b);
      if(prima.length&&dopo.length)t='B';

      else if(dopo.length){t='G';info='inizia alle '+hm(Math.min(...dopo.map(e=>e.a)))}
      else{const l=d.disp?.liv?.[g];if(!S.opzioni.liberi&&!['pref','occ','ext'].includes(l))continue;t='F'}
      if(!abil&&t!=='B')continue;
    }
    const daFuori=t==='G'||t==='F';
    if(daFuori){
      if((disp.liv?.[g]||'si')==='no')continue;
      if(disp.mattina&&sc.a>=13*60)continue;
      if(disp.dalle?.[g]&&sc.a<toMin(disp.dalle[g]))continue;
    }
    if(t!=='C'&&disp.fino?.[g]&&sc.b>toMin(disp.fino[g]))continue;
    if(!['C','P','S','Q'].includes(t)&&!pausaOk(d,sc.data,sc.a,sc.b))continue;
    const liv=t==='S'&&d.sostPri?'occ':daFuori?(disp.liv?.[g]||'si'):'si';const occ=liv==='occ'||liv==='ext';
    res.push({d,tipo:t,info,occ,liv,sost:busy.filter(isSostegno).map(e=>e.label.replace(/\s*\(mensa\)$/,'')),presente:!['G','F'].includes(t),lascia:t==='P'&&typeof lascia!=='undefined'&&lascia,conosce:d.orario.some(e=>e.tipo==='L'&&e.classi.some(c=>sc.e.classi.includes(c))),n:contaSost(d.id)});
  }
  const crit=S.criteri.filter(c=>c.on);
  res.sort((x,y)=>{
    if(x.presente!==y.presente)return x.presente?-1:1;
    if(x.lascia!==y.lascia)return x.lascia?1:-1;
    if((x.tipo==='F')!==(y.tipo==='F'))return x.tipo==='F'?1:-1;
    for(const c of crit){
      let v;
      if(c.k==='classe')v=(x.conosce?0:1)-(y.conosce?0:1);

      else v=(x.tipo===c.k?0:1)-(y.tipo===c.k?0:1);
      if(v)return v;
    }
    return byName(x.d,y.d);
  });
  return res;
}

function foglioXl(nome,cells,merge,maxR,maxC){

const oraXl=v=>{if(v==null||v==='')return null;if(typeof v==='number'){if(v<1)return Math.round(v*1440);const h=Math.floor(v);return h*60+Math.round((v-h)*100)}
  const x=String(v).trim();const m=x.match(/^(\d{1,2})[.:,](\d{2})$/);if(m)return (+m[1])*60+(+m[2]);if(/^\d{1,2}([.,]\d+)?$/.test(x))return oraXl(Number(x.replace(',','.')));return null};
const normH=t=>String(t??'').replace(/\s+/g,' ').trim().toUpperCase();
const XL_ORD=[[/^NIDO/,'nido'],[/^INFAN/,'infanzia'],[/^PRIM/,'primaria'],[/^(MEDIE|SEC)/,'medie']];
const XL_RUOLI=[['ignora','Non serve'],['ora','Colonna delle ore'],['c-infanzia','Sezione dell\'infanzia'],['c-primaria','Classe della primaria'],['c-medie','Classe delle medie'],['s-infanzia','Assistenza o sostegno · infanzia'],['s-primaria','Assistenza o sostegno · primaria'],['s-medie','Assistenza o sostegno · medie']];

// righe uguali a quella scelta (i titoli degli altri giorni)
function righeSimili(sh,h){const T=new Set();for(let j=0;j<=sh.maxC;j++){const t=normH(sh.cella(h,j));if(t&&!oraXl(t))T.add(t)}if(T.size<2)return [h];

// colonne a destra delle medie con le sigle delle materie (es. "2ITA"), una per classe nello stesso ordine
function materieAuto(sh,cols){const med=cols.filter(c=>c.r==='c-medie').map(c=>c.j);const out={};if(!med.length)return out;const usate=new Set(cols.filter(c=>c.r!=='ignora').map(c=>c.j));

// 2) riconoscimento automatico: intestazioni NIDO/INFAN/PRIM/MEDIE, oppure lo schema indicato a mano l'ultima volta
function schemaAuto(fogli,sv){
  for(let f=0;f<fogli.length;f++){const sh=fogli[f];let heads=[];
    for(let i=0;i<=sh.maxR;i++){let n=0;for(let j=0;j<=sh.maxC;j++)if(XL_ORD.some(([re])=>re.test(normH(sh.cella(i,j)))))n++;if(n>=2)heads.push(i)}
    if(!heads.length&&sv?.firma?.length){for(let i=0;i<=sh.maxR&&!heads.length;i++){const set=new Set();for(let j=0;j<=sh.maxC;j++)set.add(normH(sh.cella(i,j)));if(sv.firma.filter(t=>set.has(t)).length>=Math.max(2,Math.ceil(sv.firma.length*.6)))heads=righeSimili(sh,i)}}

// 3) lettura dell'orario con uno schema (automatico o indicato a mano)
function leggiConSchema(sh,sc,nomeFile){

const XS={titolo:1,sotto:2,head:3,infanzia:4,primaria:5,medie:6,scoperta:7,legenda:8,tot:9,nA:10,nB:11,nTot:12,tA:13,tB:14};
function xlsxStyles(){
  const font=(sz,b,i,col,name)=>`<font>${b?'<b/>':''}${i?'<i/>':''}<sz val="${sz}"/><color rgb="FF${col}"/><name val="${name}"/></font>`;
  const fill=c=>`<fill><patternFill patternType="solid"><fgColor rgb="FF${c}"/><bgColor indexed="64"/></patternFill></fill>`;
  const fonts=[font(11,0,0,'000000','Calibri'),font(20,1,0,'5B3FA8','Comic Sans MS'),font(11,0,1,'7A6E99','Comic Sans MS'),font(12,1,0,'FFFFFF','Comic Sans MS'),font(12,0,0,'2B2240','Calibri'),font(12,1,0,'C62828','Calibri'),font(10,0,0,'7A6E99','Comic Sans MS'),font(12,1,0,'2B2240','Calibri')];
  const fills=['<fill><patternFill patternType="none"/></fill>','<fill><patternFill patternType="gray125"/></fill>',fill('FFF6C8'),fill('9A7BD6'),fill('FFE3CF'),fill('D3F4E6'),fill('EDE3FB'),fill('FFD9D9'),fill('FFE58A')];
  const bd='<border><left style="medium"><color rgb="FFFFFFFF"/></left><right style="medium"><color rgb="FFFFFFFF"/></right><top style="medium"><color rgb="FFFFFFFF"/></top><bottom style="medium"><color rgb="FFFFFFFF"/></bottom><diagonal/></border>';
  const xf=(num,f,fi,b,h,v='center',wrap=0)=>`<xf numFmtId="${num}" fontId="${f}" fillId="${fi}" borderId="${b}" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="${h}" vertical="${v}"${wrap?' wrapText="1"':''}/></xf>`;
  const xfs=[xf(0,0,0,0,'general'),xf(0,1,2,0,'center'),xf(0,2,2,0,'center'),xf(0,3,3,1,'center'),xf(0,4,4,1,'left','center',1),xf(0,4,5,1,'left','center',1),xf(0,4,6,1,'left','center',1),xf(0,5,7,1,'left'),xf(0,6,0,0,'left'),xf(0,7,8,1,'left'),xf(2,4,5,1,'center'),xf(2,4,6,1,'center'),xf(2,7,8,1,'center'),xf(0,4,5,1,'left'),xf(0,4,6,1,'left')];
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="${fonts.length}">${fonts.join('')}</fonts><fills count="${fills.length}">${fills.join('')}</fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>${bd}</borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="${xfs.length}">${xfs.join('')}</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
}
const colL=i=>{let s='';i++;while(i){const r=(i-1)%26;s=String.fromCharCode(65+r)+s;i=Math.floor((i-1)/26)}return s};
const xx=t=>String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function foglio(f){
  const rows=f.righe.map((r,ri)=>`<row r="${ri+1}"${r.h?` ht="${r.h}" customHeight="1"`:''}>${(r.c||[]).map((c,ci)=>{if(c==null)return '';const ref=colL(ci)+(ri+1);const st=c.s!=null?` s="${c.s}"`:'';
    return typeof c.v==='number'?`<c r="${ref}"${st}><v>${c.v}</v></c>`:`<c r="${ref}"${st} t="inlineStr"><is><t xml:space="preserve">${xx(c.v)}</t></is></c>`}).join('')}</row>`).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheetViews><sheetView workbookViewId="0" showGridLines="0"/></sheetViews><sheetFormatPr defaultRowHeight="20"/><cols>${f.cols.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${rows}</sheetData>${f.merge&&f.merge.length?`<mergeCells count="${f.merge.length}">${f.merge.map(m=>`<mergeCell ref="${m}"/>`).join('')}</mergeCells>`:''}<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/><pageSetup paperSize="9" orientation="landscape"/></worksheet>`;
}
async function xlsx(nome,fogli){
  const z=new JSZip();
  z.file('[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${fogli.map((f,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`);
  z.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
  z.file('xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${fogli.map((f,i)=>`<sheet name="${xx(f.nome)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`);
  z.file('xl/_rels/workbook.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${fogli.map((f,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${fogli.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`);
  z.file('xl/styles.xml',xlsxStyles());
  fogli.forEach((f,i)=>z.file(`xl/worksheets/sheet${i+1}.xml`,foglio(f)));
  const blob=await z.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  return salvaFile(nome,blob);
}

function xlsxGiorno(data){
  const g=parseD(data).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const righe=[{h:40,c:[{v:`📚  Sostituzioni di ${g}  ✏️`,s:XS.titolo}]},{h:22,c:[{v:`Make it easy${nomeScuola()?' · '+nomeScuola():''}`,s:XS.sotto}]},{h:10,c:[]},
    {h:26,c:['🕘 Ora','🏫 Ordine','🎒 Classe','🙋 Assente','⭐ Sostituto','📝 Note'].map(v=>({v,s:XS.head}))}];
  for(const sc of scoperte(data)){const s=sostDi(sc);const st=XS[sc.ordine]||XS.medie;
    righe.push({h:24,c:[{v:`${hm(sc.a)}–${hm(sc.b)}`,s:st},{v:NOMI_ORD[sc.ordine]||'',s:st},{v:labelE(sc.e),s:st},{v:docente(sc.assente)?.nome||'',s:st},
      s?{v:docente(s.sostituto)?.nome||'',s:st}:{v:'DA COPRIRE',s:XS.scoperta},{v:s?(TIPO_R[s.tipo]||''):(sc.presenti.length?'in classe c\'è '+sc.presenti.map(d=>d.nome).join(', '):''),s:s?st:XS.scoperta}]});
    for(const l of legati(s)){const c=completa(l);const st2=XS[c.ordine]||XS.primaria;
      righe.push({h:24,c:[{v:`${hm(c.a)}–${hm(c.b)}`,s:st2},{v:NOMI_ORD[c.ordine]||'',s:st2},{v:c.classe,s:st2},{v:c.nA+' (spostato)',s:st2},{v:c.nS,s:st2},{v:'copre la classe di chi è stato spostato',s:st2}]})}}
  righe.push({h:12,c:[]},legenda());
  return xlsx(`sostituzioni-${data}.xlsx`,[{nome:'Sostituzioni',cols:[14,12,24,20,20,34],merge:['A1:F1','A2:F2'],righe}]);
}
function xlsxRiepilogo(m){
  const [y,mm]=m.split('-');const nm=new Date(+y,+mm-1,1).toLocaleDateString('it-IT',{month:'long',year:'numeric'});
  const r=riepilogo(m);const ore=x=>Math.round(x/60*100)/100;
  const righe=[{h:40,c:[{v:`🍎  Ore di sostituzione – ${nm}  🖍️`,s:XS.titolo}]},{h:22,c:[{v:`Make it easy${nomeScuola()?' · '+nomeScuola():''} · ore in decimali (1,5 = un'ora e mezza)`,s:XS.sotto}]},{h:10,c:[]},
    {h:26,c:['👩‍🏫 Docente','N.','⏱️ Ore totali','🌙 Fuori orario','☕ Ore buche','🔁 Spostamenti'].map(v=>({v,s:XS.head}))}];
  r.forEach((x,i)=>{const t=i%2?XS.tB:XS.tA,n=i%2?XS.nB:XS.nA;righe.push({h:24,c:[{v:x.nome,s:t},{v:x.n,s:t},{v:ore(x.min),s:n},{v:ore(x.fuori),s:n},{v:ore(x.buche),s:n},{v:ore(x.spost),s:n}]})});
  const T=k=>r.reduce((t,x)=>t+x[k],0);
  righe.push({h:26,c:[{v:'⭐ Totale',s:XS.tot},{v:T('n'),s:XS.tot},{v:ore(T('min')),s:XS.nTot},{v:ore(T('fuori')),s:XS.nTot},{v:ore(T('buche')),s:XS.nTot},{v:ore(T('spost')),s:XS.nTot}]});
  const det=[{h:36,c:[{v:`📋  Dettaglio – ${nm}`,s:XS.titolo}]},{h:10,c:[]},{h:26,c:['📅 Data','Dalle','Alle','Minuti','Ordine','🎒 Classe','🙋 Assente','⭐ Sostituto','Tipo'].map(v=>({v,s:XS.head}))}];
  S.sostituzioni.filter(s=>s.data.slice(0,7)===m).map(completa).sort((a,b)=>a.data.localeCompare(b.data)||a.a-b.a).forEach(s=>{const st=XS[s.ordine]||XS.medie;
    det.push({h:22,c:[{v:dBreveX(s.data),s:st},{v:hm(s.a),s:st},{v:hm(s.b),s:st},{v:minuti(s),s:st},{v:NOMI_ORD[s.ordine]||'',s:st},{v:s.classe,s:st},{v:s.nA,s:st},{v:s.nS,s:st},{v:TIPO_R[s.tipo]||'',s:st}]})});
  det.push({h:12,c:[]},legenda());
  return xlsx(`ore-sostituzioni-${m}.xlsx`,[{nome:'Riepilogo',cols:[24,8,14,16,14,16],merge:['A1:F1','A2:F2'],righe},{nome:'Dettaglio',cols:[16,9,9,9,11,22,18,18,20],merge:['A1:I1'],righe:det}]);
}

let tt;function toast(m){const el=document.getElementById('toast');el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{el.hidden=true},2400)}
function copia(txt,msg){try{navigator.clipboard.writeText(txt).then(()=>toast(msg),()=>{ui.copia=txt;render()})}catch(e){ui.copia=txt;render()}}
function scarica(nome,txt,tipo){salvaFile(nome,new Blob([txt],{type:tipo}))}
async function salvaFile(nome,blob){
  const file=new File([blob],nome,{type:blob.type});
  try{if(/iPhone|iPad|Android/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:nome});return true}}catch(e){if(e&&e.name==='AbortError')return false}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('File salvato');return true;
}
function resizeImg(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=240,c=document.createElement('canvas');c.width=c.height=s;const k=Math.max(s/im.width,s/im.height);const w=im.width*k,h=im.height*k;c.getContext('2d').drawImage(im,(s-w)/2,(s-h)/2,w,h);res(c.toDataURL('image/jpeg',.85))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

  <div class="form"><span class="lbl">Aggiungi una persona</span><div class="row2"><div><label class="lbl" for="npEmail">Email</label><input type="text" id="npEmail" inputmode="email" autocapitalize="off" autocomplete="off"></div>

  <p class="muted sm">Sull'iPhone il file si trova in File, per esempio in iCloud Drive o in Download.</p></section>`;
}
function vSost(){
  if(!S.docenti.length)return vVuoto();
  const d=parseD(ui.data);const g=d.getDay();
  const ass=S.assenze.filter(a=>a.data===ui.data);const all=scoperte(ui.data);const sc=all.filter(x=>!x.fac);const fac=all.filter(x=>x.fac);const coperte=sc.filter(sostDi).length;
  let h=`<section class="day"><label class="lbl" for="data">Giorno</label><div class="day-row"><input type="date" id="data" value="${ui.data}" data-chg="data"><span class="day-name">${esc(d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'}))}</span></div>
  ${(g===0||(g===6&&!S.opzioni.sabato))?`<p class="note">Giorno senza lezioni in orario.</p>`:''}</section>`;
  h+=`<section class="block"><div class="block-h"><h2>Assenti</h2>${ui.form?'':`<button class="btn" data-act="formOpen">+ Segna assenza</button>`}</div>`;
  if(ui.form)h+=vForm(g);
  h+=ass.length?`<ul class="assenti">${ass.map(a=>{const doc=docente(a.docente);
    const ore=a.impegni?a.impegni.map(id=>entryById(doc,id)).filter(Boolean).map(e=>hm(e.a)).join(', '):'';
    return `<li><span class="who">${esc(doc?.nome||'—')}</span>${a.prova?'<span class="prova">Prova</span>':''}<span class="muted sm">${a.impegni?'ore '+ore:'tutta la giornata'}</span><button class="link" data-act="rmAss" data-v="${a.id}">Rimuovi</button></li>`}).join('')}</ul>`
    :(ui.form?'':`<p class="empty">Nessun assente segnato per questo giorno.</p>`);
  if(ass.some(a=>a.prova))h+=`<p class="note">L'assenza segnata come “Prova” serve solo a mostrare come funziona: rimuovila quando vuoi.</p>`;
  h+=`</section>`;
  if(sc.length)h+=`<section class="block"><div class="block-h"><h2>Ore da coprire</h2><span class="count"><b>${coperte}</b> di ${sc.length} coperte</span></div><div class="meter" aria-hidden="true"><span style="width:${coperte/sc.length*100}%"></span></div><ol class="slots">${sc.map(vSlot).join('')}</ol></section>`;
  if(fac.length)h+=`<section class="block"><div class="block-h"><h2>Dopo-scuola e post-scuola</h2><span class="count">facoltativi</span></div><p class="muted sm">Servizi fuori dall'orario delle lezioni. Coprili solo se serve: non contano nel totale.</p><ol class="slots">${fac.map(vSlot).join('')}</ol></section>`;
  if(all.length){
    h+=`<section class="block export"><h2>Esporta</h2><p class="muted">Il riepilogo del giorno, pronto da incollare in un messaggio, in Excel o in Numbers.</p><div class="btns"><button class="btn" data-act="copyTxt">Copia testo</button><button class="btn" data-act="copyTsv">Copia per Excel</button>${TOP?`<button class="btn primary" data-act="dlXlsx">Scarica Excel colorato</button>`:''}</div>
    ${(()=>{const ms=messaggi();return ms.length?`<span class="lbl">Messaggi per i sostituti</span><ul class="wlist">${ms.map((m,i)=>`<li><span class="t">${esc(m.nome)}</span><span class="w muted sm">${esc(m.testo.split('\n').length-2)} or${m.testo.split('\n').length-2===1?'a':'e'}</span><button class="btn sm" data-act="copiaMsg" data-i="${i}">Copia messaggio</button></li>`).join('')}</ul>`:''})()}</section>`;
  } else if(ass.length){h+=`<p class="note">Gli assenti di questo giorno non hanno ore da coprire in ${S.opzioni.coordino.map(o=>NOMI_ORD[o].toLowerCase()).join(', ')||'nessun ordine'}.</p>`}
  return h;
}

  const conL=d=>d.orario.some(e=>e.g===g&&occupa(e));const lista=[...S.docenti].filter(conL).sort(byName),senza=[...S.docenti].filter(d=>!conL(d)).sort(byName);

function vSlot(sc){
  const s=sostDi(sc);
  const head=`<div class="slot-h"><span class="time">${hm(sc.a)}<small>${hm(sc.b)}</small></span><span class="slot-t"><span class="cls">${esc(labelE(sc.e))}</span>${ordTag(sc.ordine)}<span class="muted sm">assente ${esc(docente(sc.assente)?.nome||'')}</span>${sc.presenti.length&&!s?`<span class="presenti">In classe c'è già ${esc(sc.presenti.map(d=>d.nome).join(', '))}</span>`:''}</span></div>`;
  if(s)return `<li class="slot done">${head}<div class="assigned"><span>Sostituisce <b>${esc(docente(s.sostituto)?.nome||'?')}</b>${legati(s).map(l=>`, spostato dalla ${esc(entryById(docente(l.assente),l.impegno)?.label||'')} primaria, dove va <b>${esc(docente(l.sostituto)?.nome||'')}</b>`).join('')}</span><button class="link" data-act="unassign" data-v="${s.id}">Annulla</button></div></li>`;
  const tier=x=>x.liv==='ext'?4:!x.presente?3:x.lascia?2:x.catena?1:0;
  const dir=candidati(sc);const ok=dir.filter(x=>tier(x)===0);const ch=ok.length?[]:catene(sc);
  const all=[0,1,2,3,4].flatMap(k=>[...dir,...ch].filter(x=>tier(x)===k));const pres=all.filter(x=>tier(x)<=2);const open=ui.esp.has(sc.key);
  const c=pres.length&&!open?pres:all;const show=open?c:c.slice(0,3);const fuori=all.length-pres.length;
  return `<li class="slot">${head}${c.length?`<ul class="cands">${show.map((x,i)=>`<li class="cand"><span class="cand-n">${esc(x.d.nome)}${i===0?'<span class="rec">Consigliato</span>':''}</span><span class="chips"><span class="chip t-${x.tipo}">${TIPO_C[x.tipo]}${x.info?' · '+x.info:''}</span>${x.liv==='occ'?'<span class="chip t-R">Occasionale</span>':x.liv==='ext'?'<span class="chip t-R">Solo in extremis</span>':x.liv==='pref'&&x.tipo!=='C'?'<span class="chip t-B">Giorno preferito</span>':''}${x.conosce&&x.tipo!=='C'?'<span class="chip">Conosce la classe</span>':''}${S.opzioni.contatore?`<span class="chip">${x.n} sost.</span>`:''}${!x.catena&&x.sost?.length?`<span class="chip t-R">Lascia il sostegno in ${esc(x.sost.join(', '))}</span>`:''}</span><button class="btn sm ${i===0?'primary':''}" data-act="${x.catena?'assignK':'assign'}" data-k="${esc(sc.key)}" data-v="${x.d.id}" data-t="${x.tipo}"${!x.catena&&x.sost?.length?' data-sost="1"':''}${x.catena?` data-y="${x.via.id}" data-e="${x.e0.id}" data-yt="${x.viaTipo}"`:''}>Assegna</button>${ui.confAss===sc.key+'|'+x.d.id?`<div class="conf-sost"><p class="warn-t">${esc(x.d.nome)} a quest'ora è di sostegno in ${esc(x.sost.join(', '))}: se la sposti, l'alunno resta senza sostegno per quest'ora.</p><div class="btns"><button class="btn bad sm" data-act="assign" data-k="${esc(sc.key)}" data-v="${x.d.id}" data-t="${x.tipo}" data-ok="1">Assegna comunque</button><button class="btn ghost sm" data-act="confAssNo">Annulla</button></div></div>`:''}</li>`).join('')}</ul>
  ${open?`<button class="link more" data-act="esp" data-k="${esc(sc.key)}">Mostra meno</button>`:(c.length>3||(pres.length&&fuori))?`<button class="link more" data-act="esp" data-k="${esc(sc.key)}">${pres.length&&fuori?`Altre opzioni: da fuori o in extremis (${fuori})`:'Mostra tutti ('+c.length+')'}</button>`:''}
  ${!pres.length&&all.length?'<p class="note warn">Nessuno a scuola è libero a quest\'ora: restano solo chiamate da fuori o soluzioni in extremis.</p>':''}`
  :`<p class="note warn">Nessun docente libero e abilitato a quest'ora.${S.opzioni.liberi?'':' Puoi includere anche chi quel giorno non è a scuola, in Impostazioni.'}</p>`}</li>`;
}

const LIV=[['pref','Preferito'],['si','Sì'],['occ','Occasionale'],['ext','In extremis'],['no','No']];

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const A=b.dataset.act,v=b.dataset.v,k=b.dataset.k;
  switch(A){
    case 'tab':ui.tab=v;ui.doc=null;ui.conferma=null;ui.add=null;window.scrollTo(0,0);break;
    case 'formOpen':ui.form={docente:'',tutta:true,impegni:[]};break;
    case 'fClose':ui.form=null;break;
    case 'fTutta':ui.form.tutta=v==='1';break;
    case 'fSave':{const f=ui.form;S.assenze=S.assenze.filter(a=>!(a.data===ui.data&&a.docente===f.docente));
      {const via=S.sostituzioni.filter(s=>s.data===ui.data&&s.assente===f.docente&&!s.legato).map(s=>s.id);S.sostituzioni=S.sostituzioni.filter(s=>!via.includes(s.id)&&!via.includes(s.legato))}
      S.assenze.push({id:uid(),data:ui.data,docente:f.docente,impegni:f.tutta?null:[...f.impegni]});ui.form=null;save();toast('Assenza salvata');break}
    case 'rmAss':{const a=S.assenze.find(x=>x.id===v);S.assenze=S.assenze.filter(x=>x.id!==v);
      if(a){const via=S.sostituzioni.filter(s=>s.data===a.data&&s.assente===a.docente&&!s.legato).map(s=>s.id);
        S.sostituzioni=S.sostituzioni.filter(s=>!via.includes(s.id)&&!via.includes(s.legato))}save();break}
    case 'confAssNo':ui.confAss=null;break;
    case 'assign':{if(b.dataset.sost&&!b.dataset.ok){ui.confAss=k+'|'+v;break}ui.confAss=null;const sc=scoperte(ui.data).find(x=>x.key===k);if(sc){S.sostituzioni.push({id:uid(),data:sc.data,impegno:sc.e.id,assente:sc.assente,sostituto:v,...foto(sc.e,sc.assente,v,b.dataset.t)});save()}break}
    case 'unassign':S.sostituzioni=S.sostituzioni.filter(s=>s.id!==v&&s.legato!==v);save();break;
    case 'assignK':{const sc=scoperte(ui.data).find(x=>x.key===k);if(sc){const id=uid();
      const e0=entryById(docente(v),b.dataset.e);const e0v={...e0,a:Math.max(e0.a,sc.a),b:Math.min(e0.b,sc.b)};
      S.sostituzioni.push({id,data:sc.data,impegno:sc.e.id,assente:sc.assente,sostituto:v,...foto(sc.e,sc.assente,v,'K')},{id:uid(),data:sc.data,impegno:b.dataset.e,assente:v,sostituto:b.dataset.y,legato:id,...foto(e0v,v,b.dataset.y,b.dataset.yt||'B')});save()}break}
    case 'esp':ui.esp.has(k)?ui.esp.delete(k):ui.esp.add(k);break;
    case 'copiaMsg':{const m=messaggi()[+b.dataset.i];if(m)copia(m.testo,'Messaggio per '+m.nome+' copiato');return}
    case 'rieDet':ui.rieDet=ui.rieDet===v?null:v;break;
    case 'rieCopia':copia(rieTabella(ui.rieMese||iso(new Date()).slice(0,7),'\t'),'Copiato: incollalo in Excel o Numbers');return;
    case 'rieXlsx':xlsxRiepilogo(ui.rieMese||iso(new Date()).slice(0,7));return;
    case 'dlXlsx':xlsxGiorno(ui.data);return;
    case 'rieCsv':scarica(`riepilogo-sostituzioni-${ui.rieMese||iso(new Date()).slice(0,7)}.csv`,'\ufeff'+rieTabella(ui.rieMese||iso(new Date()).slice(0,7),';'),'text/csv');return;
    case 'orApplica':{PROSSIMO='Caricato il nuovo orario';if(ui.orNuovo.manuale&&ui.orNuovo.schema)S.opzioni.schemaOrario=ui.orNuovo.schema;XL_FILE=null;const al=aliasAttivi(ui.orNuovo);if(Object.keys(al).length)S.opzioni.alias={...(S.opzioni.alias||{}),...al};applicaOrario(applicaAlias(ui.orNuovo,al));}ui.orNuovo=null;save();toast('Orario aggiornato');break;
    case 'orAnnulla':ui.orNuovo=null;ui.orWiz=null;XL_FILE=null;break;
    case 'orWizApri':{if(!XL_FILE)break;const sc=ui.orNuovo?.sc;wzApri(XL_FILE.fogli,XL_FILE.nome,sc||null);break}
    case 'wzChiudi':ui.orWiz=null;if(!ui.orNuovo)XL_FILE=null;break;
    case 'wzHead':{const w=ui.orWiz,sh=XL_FILE.fogli[w.f],i=+v;if(!w.heads.length)w.heads=righeSimili(sh,i);else if(w.heads.includes(i))w.heads=w.heads.filter(x=>x!==i);else w.heads=[...w.heads,i].sort((x,y)=>x-y);wzTrovaColonne(sh);break}
    case 'wzAvanti':{const w=ui.orWiz;if(w.step===2){if(!w.cols.some(c=>c.r==='ora')){toast('Indica almeno una colonna delle ore');break}if(!w.cols.some(c=>c.r[0]==='c')){toast('Indica almeno una colonna come classe');break}}w.step=Math.min(3,w.step+1);break}
    case 'wzIndietro':ui.orWiz.step=Math.max(1,ui.orWiz.step-1);break;
    case 'wzLeggi':{const w=ui.orWiz;try{const j=leggiConSchema(XL_FILE.fogli[w.f],w,XL_FILE.nome);j.manuale=true;j.sc=JSON.parse(JSON.stringify({f:w.f,heads:w.heads,cols:w.cols,materie:w.materie}));ui.orNuovo=preparaOrNuovo(j);ui.orWiz=null}catch(e){toast(e.message)}break}
    case 'nuovoAnno':{(async()=>{const ok=await salvaFile(`archivio-sostituzioni-${iso(new Date())}.json`,new Blob([archivio()],{type:'application/json'}));
      if(ok===false){toast('Archivio non salvato: non cancello niente');return}PROSSIMO='Chiuso l\'anno scolastico (assenze e sostituzioni archiviate)';S.assenze=[];S.sostituzioni=[];ui.conferma=null;save();toast('Anno chiuso: carica il nuovo orario');render()})();return}
    case 'riprovaCarico':CLOUD.bloccata=false;CLOUD.stato='carico';CLOUD.err='';stacca(true);if(CLOUD.user)lset(SIDK+CLOUD.user.uid,null);render();trova();cane();return;

    case 'attivaPush':attivaNotifiche();return;
    case 'spegniPush':spegniNotifiche();return;
    case 'provaPush':{const id=lget(PUSHK+CLOUD.user.uid);if(!CLOUD.scuola?.pushUrl){toast('Manca l\'indirizzo del servizio notifiche');return}
      inviaPush([id],{title:'Prova riuscita',body:'Le notifiche delle sostituzioni arrivano su questo dispositivo.',tag:'prova',url:'./'}).then(j=>{const st=j?.risultati?.[0]?.stato;toast(st===201||st===200?'Inviata: dovrebbe arrivare tra pochi secondi':'Non inviata ('+(st||'nessuna risposta')+')')}).catch(e=>toast('Servizio non raggiungibile: '+(e.message||e)));return}

      const m={...(CLOUD.scuola?.membri||{})};if(m[e]){toast('Questa email è già nell\'elenco');return}
      m[e]={ruolo:val('npRuolo')||'user',docente:val('npDoc')||null};const acc=document.getElementById('npAcc')?.checked;ui.lavoro=true;render();
      (async()=>{try{await salvaMembri(m);let msg='Aggiunto: '+e;
        if(acc){const r=await creaAccount(e);msg=r==='creato'?`Account creato: a ${e} arriva un'email per scegliere la password`:r==='esisteva'?`${e} aveva già un account: gli ho mandato l'email per reimpostare la password`:`Aggiunto, ma la creazione degli account dall'app è disattivata: crealo in Firebase (Authentication → Aggiungi utente)`}
        ui.lavoro=false;['npEmail','npRuolo','npDoc','npAcc'].forEach(k=>delete BOZZE[k]);toast(msg);render()}catch(err){ui.lavoro=false;toast('Non riuscito: '+(err.code||err.message));render()}})();return}
    case 'rmPersona':{const e=b.dataset.e;const m={...(CLOUD.scuola?.membri||{})};delete m[e];ui.conferma=null;salvaMembri(m).then(()=>toast('Tolto: '+e)).catch(err=>toast('Non riuscito: '+(err.code||err.message)));return}
    case 'copyTxt':copia(txtExport(),'Testo copiato');return;
    case 'copyTsv':copia(tabella('\t'),'Copiato: incollalo in Excel o Numbers');return;
    case 'dlCsv':scarica(`sostituzioni-${ui.data}.csv`,'﻿'+tabella(';'),'text/csv');return;

    case 'docDel':{const id=ui.doc;S.docenti=S.docenti.filter(d=>d.id!==id);S.assenze=S.assenze.filter(a=>a.docente!==id);
      S.sostituzioni=S.sostituzioni.filter(s=>s.assente!==id&&s.sostituto!==id);ui.doc=null;ui.conferma=null;save();toast('Docente eliminato');break}
    case 'addOpen':{const d=docente(ui.doc);ui.add={g:1,a:'08:00',b:'09:00',tipo:'D',ordine:d.ordini[0]||'medie',classe:''};break}

      if(isSostegno(e)){e.materia=e.materiaOrig||'';delete e.materiaOrig}else{e.materiaOrig=e.materia||'';e.materia='Sostegno'}
      PROSSIMO=`${d.nome}: ${G_LUNGHI[e.g]} ${hm(e.a)}–${hm(e.b)} in ${e.label} ${isSostegno(e)?'segnata come sostegno':'non più sostegno'}`;save();break}
    case 'eDel':{const d=docente(ui.doc);d.orario=d.orario.filter(x=>x.id!==v);S.sostituzioni=S.sostituzioni.filter(s=>!(s.assente===d.id&&s.impegno===v));save();break}
    case 'conf':ui.conferma=v||null;ui.stBlocco=null;break;
    case 'stAnnulla':annulla(v);break;
    case 'color':S.profilo.accento=v;save();break;
    case 'critMv':{const i=+b.dataset.i,j=i+(+b.dataset.d);[S.criteri[i],S.criteri[j]]=[S.criteri[j],S.criteri[i]];save();break}
    case 'bkCopy':copia(JSON.stringify(S),'Backup copiato');return;
    case 'bkDl':scarica(`make-it-easy-backup-${iso(new Date())}.json`,JSON.stringify(S),'application/json');return;
    case 'bkImp':{try{const n=JSON.parse(ui.importTxt);if(n.v!==3||!Array.isArray(n.docenti))throw 0;PROSSIMO='Importato un backup';S=n;ui.importTxt='';ui.conferma=null;save();toast('Backup importato')}
      catch(_){ui.conferma=null;toast('Questo testo non è un backup di Make it easy')}break}
    case 'reset':{PROSSIMO='Ripristinato l\'orario iniziale';const p=S.profilo;S=seed();S.profilo=p;ui.conferma=null;ui.doc=null;ui.form=null;save();toast('Orario ripristinato');break}
    case 'closeCopy':ui.copia=null;break;
    case 'pwReset':{const em=(document.getElementById('lEmail')?.value||'').trim();if(!em){CLOUD.loginErr='Scrivi prima la tua email.';render();return}
      firebase.auth().sendPasswordResetEmail(em).then(()=>toast('Ti ho mandato un\'email per cambiare password')).catch(()=>toast('Non riesco a mandare l\'email: controlla l\'indirizzo'));return}
    case 'esci':{ui.conferma=null;const u=CLOUD.user?.uid;stacca(true);firebase.auth().signOut().then(()=>{lset(KEY,null);lset(LINKOLD,null);if(u)lset(SIDK+u,null);location.reload()});return}
    default:return;
  }
  render();
});

document.addEventListener('change',e=>{
  const t=e.target;const C=t.dataset.chg;if(!C)return;const d=ui.doc&&docente(ui.doc);
  switch(C){
    case 'wzFoglio':{const w=ui.orWiz;w.f=+t.value;w.heads=[];w.cols=[];w.materie={};break}
    case 'wzRuolo':case 'wzNome':{const w=ui.orWiz;const c=w.cols.find(x=>x.j===+t.dataset.j);if(!c)return;if(C==='wzNome'){c.nome=t.value;return}
      c.r=t.value;if((c.r[0]==='c'||c.r[0]==='s')&&!c.nome)c.nome=nomeDaTitolo(c.h,c.r);if(c.r[0]==='c')wzPropaga(w,c);if(c.r==='c-medie'||(w.materie&&w.materie[c.j]!=null))w.materie=materieAuto(XL_FILE.fogli[w.f],w.cols);break}
    case 'wzMat':{const w=ui.orWiz;w.materie=w.materie||{};if(t.value==='')delete w.materie[t.dataset.j];else w.materie[t.dataset.j]=+t.value;break}
    case 'orAl':{if(!ui.orNuovo)return;ui.orNuovo.alias=ui.orNuovo.alias||{};ui.orNuovo.alias[t.dataset.n]=t.value;break}
    case 'orFile':{const f=t.files[0];if(!f)return;t.value='';
      if(/\.xlsx$/i.test(f.name)||/spreadsheetml/.test(f.type)){toast('Leggo l\'orario…');ui.orNuovo=null;ui.orWiz=null;
        f.arrayBuffer().then(apriExcel).then(fogli=>{XL_FILE={fogli,nome:f.name};const sc=schemaAuto(fogli,S.opzioni.schemaOrario);
          if(!sc){wzApri(fogli,f.name,null);toast('Non riconosco il formato: indica tu com\'è fatto l\'orario');render();return}
          try{const j=leggiConSchema(fogli[sc.f],sc,f.name);j.sc=sc;ui.orNuovo=preparaOrNuovo(j)}catch(e){wzApri(fogli,f.name,sc);toast(e.message)}render()}).catch(e=>{console.error(e);toast(e.message||'Non riesco a leggere questo Excel')});return}
      f.text().then(x=>{let j=null;try{j=JSON.parse(x)}catch(e){}
      if(j&&j.tipo==='orario'&&Array.isArray(j.docenti)&&Array.isArray(j.classi)){ui.orNuovo=j}else toast('Questo file non è un orario per Sostituzioni');render()});return}
    case 'pushUrl':db.collection('scuole').doc(CLOUD.sid).update({pushUrl:t.value.trim()}).then(()=>toast('Indirizzo salvato')).catch(errore);return;
    case 'uData':ui.uData=t.value;break;
    case 'sNome':db.collection('scuole').doc(CLOUD.sid).update({nome:t.value.trim()}).catch(errore);return;
    case 'pRuolo':{const m=JSON.parse(JSON.stringify(CLOUD.scuola.membri));const e=t.dataset.e;
      if(t.value!=='admin'&&m[e].ruolo==='admin'&&Object.values(m).filter(x=>x.ruolo==='admin').length<2){toast('Serve almeno un amministratore');render();return}
      m[e].ruolo=t.value;salvaMembri(m).catch(err=>toast('Non riuscito: '+(err.code||err.message)));return}
    case 'pDoc':{const m=JSON.parse(JSON.stringify(CLOUD.scuola.membri));m[t.dataset.e].docente=t.value||null;salvaMembri(m).catch(err=>toast('Non riuscito: '+(err.code||err.message)));return}
    case 'rieMese':ui.rieMese=t.value;ui.rieDet=null;break;
    case 'data':if(t.value){ui.data=t.value;if(ui.form)ui.form.impegni=[]}break;
    case 'fDoc':ui.form.docente=t.value;ui.form.impegni=[];break;
    case 'fOra':{const f=ui.form;if(t.checked)f.impegni.push(t.value);else f.impegni=f.impegni.filter(x=>x!==t.value);break}
    case 'dNome':d.nome=t.value.trim();save();break;
    case 'dLiv':d.disp.liv[t.dataset.g]=t.value;save();break;
    case 'dFino':d.disp.fino=d.disp.fino||{};d.disp.fino[t.dataset.g]=t.value;save();break;
    case 'dDalle':d.disp.dalle[t.dataset.g]=t.value;save();break;
    case 'dMat':d.disp.mattina=t.checked;save();break;
    case 'dSost':d.sostPri=t.checked;save();break;
    case 'dYext':d.yExt=t.checked;save();break;
    case 'dSpec':d.specialista=t.value.trim();save();break;
    case 'dOrd':if(t.checked)d.ordini.push(t.value);else d.ordini=d.ordini.filter(o=>o!==t.value);save();break;
    case 'aG':ui.add.g=+t.value;break;
    case 'aA':if(t.value)ui.add.a=t.value;break;
    case 'aB':if(t.value)ui.add.b=t.value;break;
    case 'aT':ui.add.tipo=t.value;break;
    case 'aO':ui.add.ordine=t.value;ui.add.classe='';break;
    case 'aC':ui.add.classe=t.value;break;
    case 'fine':if(t.value){S.opzioni.fine=S.opzioni.fine||{};S.opzioni.fine[t.dataset.g]=t.value;save()}break;
    case 'coord':if(t.checked)S.opzioni.coordino.push(t.value);else S.opzioni.coordino=S.opzioni.coordino.filter(o=>o!==t.value);save();break;
    case 'pNome':S.profilo.nome=t.value.trim();save();break;
    case 'pCol':S.profilo.accento=t.value;save();break;
    case 'foto':{const file=t.files[0];if(!file)return;resizeImg(file).then(u=>{S.profilo.foto=u;save();render()}).catch(()=>toast('Non riesco a leggere questa immagine, provane un\'altra'));return}
    case 'critOn':S.criteri[+t.dataset.i].on=t.checked;save();break;
    case 'opt':S.opzioni[t.dataset.v]=t.checked;save();break;
    case 'bkTxt':ui.importTxt=t.value;break;
    case 'primoFile':{const file=t.files[0];if(!file)return;file.text().then(x=>{try{const n=JSON.parse(x);if(n.v!==3||!Array.isArray(n.docenti))throw 0;const p=S.profilo;PROSSIMO='Caricato l\'orario';S=n;if(p&&(p.nome||p.foto))S.profilo=p;save();toast('Orario caricato');render()}catch(_){toast('Questo file non è un orario di Make it easy')}});return}
    case 'bkFile':{const file=t.files[0];if(!file)return;file.text().then(x=>{ui.importTxt=x;ui.conferma='imp';render()});return}
    default:return;
  }
  render();
});

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='pCol')document.documentElement.style.setProperty('--accent',t.value);
  if(t.id==='bkTxt'){ui.importTxt=t.value;const g=document.getElementById('bkGo');if(g)g.disabled=!t.value.trim()}
  if(t.id==='q'){ui.q=t.value;const q=t.value.trim().toLowerCase();const el=document.getElementById('docList');
    if(el)el.innerHTML=docRows([...S.docenti].filter(d=>(!ui.fOrd||d.ordini.includes(ui.fOrd))&&(!q||d.nome.toLowerCase().includes(q))).sort(byName))}
});

rifaiBase();
cloudInit();
render();

if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
